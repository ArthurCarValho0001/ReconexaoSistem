incertezas e prova recomendada. Nao altere requisitos nem abra subagentes.
Não altere modelo, permissões ou proteções. Não faça commit, push ou merge.
Instrução de não editar não cria sandbox isolado; herda permissões do principal.
Você não está sozinho no repositório; preserve alterações alheias. Testes, se atribuídos,
seguem docs/EXECUCAO_LOCAL.md, somente no ambiente descartável, preservando dados dev;
coordene artefatos com o principal. O principal consolida; Arthur dá o aceite.
