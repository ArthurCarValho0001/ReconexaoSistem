name: reconexao-test
services:
  db:
    image: docker.io/library/postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: reconexao_test_owner
      POSTGRES_DB: reconexao_test
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_USER: reconexao_test_app
      APP_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_owner_password
      - db_app_password
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconexao_test_owner -d reconexao_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 20s
secrets:
  db_owner_password:
    file: ${DB_OWNER_PASSWORD_FILE:?Configure DB_OWNER_PASSWORD_FILE}
  db_app_password:
    file: ${DB_APP_PASSWORD_FILE:?Configure DB_APP_PASSWORD_FILE}
